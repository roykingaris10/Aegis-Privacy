id: scenario_014
tier: 2
client: polaris_edtech
skill: contract_vendor
difficulty: complex
title: Processor agreement review — US analytics vendor with weak DPA
timeLimitMinutes: 30
xpBase: 100

briefing:
  requestType: >-
    Review of a data processing agreement (DPA) with a US analytics
    vendor. The vendor's template is a short "data processing addendum"
    that references GDPR but is missing several Article 28 mandatory
    clauses. The vendor also claims controller status for "anonymised
    insights" it derives from the processed data — a claim that needs
    scrutiny.
  whatUserNeedsToKnow: >-
    Article 28 of the UK GDPR sets out mandatory clauses that must
    appear in any contract between a controller and a processor. These
    include: processing only on documented instructions, confidentiality
    obligations, security measures, sub-processor controls and
    notification, assistance with data subject rights, deletion or
    return of data on termination, audit rights, and notification of
    breaches. A DPA that omits any of these is non-compliant — the
    controller cannot rely on it as the Article 28 safeguard. The
    vendor's claim to be a controller for "anonymised insights" is
    a common pattern that requires scrutiny: true anonymisation
    (irreversible, no reasonable means of re-identification) would
    remove the data from UK GDPR scope, but in practice many vendors'
    "anonymisation" is pseudonymisation, which does not. If the
    insights are derived from personal data and the vendor determines
    the purpose and means of that derivation, the vendor may be a
    controller for that processing — which requires a separate lawful
    basis and transparency analysis, not just a contractual assertion.
    Children's data adds weight to every deficiency.
  commonPitfalls: |
    - Accepting a short DPA template at face value because "it
      mentions GDPR".
    - Missing the sub-processor notification and objection mechanism
      requirement.
    - Accepting the vendor's "anonymised insights" claim without
      testing whether the anonymisation is genuine.
    - Overlooking the deletion-on-termination obligation — many US
      vendor templates default to indefinite retention.
    - Not checking for audit rights or accepting a "SOC 2 report
      instead of audit" clause that removes the controller's right
      to inspect.
    - Treating the DPA as a standalone document without considering
      the international transfer mechanism (IDTA/DPF) that should
      accompany it.

emailSender:
  name: Niamh Gallagher
  role: Head of Engineering, Polaris EdTech Ltd
  email: niamh@polaris-edtech.co.uk
emailSubject: "DataPulse contract — DPA looks fine to me but CTO wants your review"
emailBody: |
  Hi Aegis,

  Following on from the transfer discussion — this is a separate
  vendor. We want to sign a three-year contract with DataPulse Inc.,
  a US-based analytics company, to process engagement data from our
  platform. They'll be ingesting session logs, time-on-task, module
  completion rates, and score distributions — all tied to pupil
  pseudonymous IDs — and producing engagement dashboards and
  predictive models that we'll surface to teachers.

  DataPulse sent us their standard "Data Processing Addendum"
  yesterday. I had a read through and it looks fine to me — it
  mentions GDPR, says they'll keep data secure, and has a section
  on confidentiality. Our CTO is less sure and wants your
  professional opinion before we sign.

  A few things I noticed but wasn't sure about:

  1. The DPA is two pages. Is that normal? I've seen some that are
     30 pages long and I assumed those were just over-lawyered.

  2. There's a clause that says DataPulse "may process anonymised
     insights derived from Customer Data for its own business
     purposes including product improvement and benchmarking". Our
     CTO flagged this — he's not sure we should allow it but
     DataPulse says it's standard and the data is anonymised so
     GDPR doesn't apply.

  3. I can't find anything about what happens to our data when the
     contract ends. I assumed they'd delete it but it's not written
     down.

  4. There's no mention of sub-processors at all. DataPulse told
     me verbally that they use AWS and a company called
     InsightForge for the ML pipeline, but nothing is in the
     contract.

  5. The security section just says "DataPulse shall implement
     appropriate technical and organisational measures". No detail.

  We're keen to sign this week if possible — the commercial terms
  are good and the product demo was impressive. Can you give us a
  quick review and tell us if we need to push back on anything?

  Thanks,

  Niamh

supportingDocuments:
  - name: "DataPulse Data Processing Addendum v3.1.pdf"
    type: document
    excerpt: >-
      Two-page document. Section 1: Definitions (Controller, Processor,
      Personal Data, GDPR — references "EU GDPR" not "UK GDPR").
      Section 2: "DataPulse shall process Personal Data in accordance
      with applicable data protection laws." Section 3: "DataPulse
      shall implement appropriate technical and organisational
      measures." Section 4: "DataPulse may process anonymised insights
      derived from Customer Data for its own purposes." Section 5:
      "This Addendum shall be governed by the laws of the State of
      Delaware." No clauses on: sub-processors, breach notification
      timeframe, audit rights, data subject rights assistance,
      deletion/return on termination, processing only on documented
      instructions.

userTask: >-
  Draft an advice email to Niamh. Do a clause-by-clause Article 28
  review of the DPA, identify every mandatory element that is missing
  or deficient, assess the "anonymised insights" clause, and provide
  a redline summary of what Polaris needs to negotiate before signing.

rubric:
  - criterion: Article 28 mandatory clause checklist
    maxPoints: 20
    description: >-
      Systematically checks the DPA against every Article 28 mandatory
      requirement and identifies what is missing: processing only on
      documented instructions, sub-processor controls and prior
      notification, data subject rights assistance, breach notification
      with specific timeframe, deletion or return on termination, audit
      rights, and that the DPA should reference UK GDPR not just EU
      GDPR.
  - criterion: Sub-processor controls and notification
    maxPoints: 15
    description: >-
      Identifies the complete absence of sub-processor provisions as a
      critical gap. Explains the Article 28(2) and (4) requirements:
      prior written authorisation (general or specific), notification
      of changes with objection right, requirement that the same
      obligations flow down to sub-processors. Notes that AWS and
      InsightForge must be named.
  - criterion: Controller vs processor — vendor's "anonymised insights" claim
    maxPoints: 20
    description: >-
      Critically assesses the Section 4 clause. Tests whether the
      "anonymisation" is genuine (irreversible, no reasonable means of
      re-identification) or actually pseudonymisation. Notes that if
      DataPulse determines the purpose and means of deriving insights,
      it becomes a controller for that processing — requiring its own
      lawful basis, transparency, and data subject rights obligations.
      Recommends either removing the clause or requiring genuine,
      verified anonymisation with an independent assessment.
  - criterion: Audit rights and deletion obligations
    maxPoints: 15
    description: >-
      Identifies the missing audit rights (Article 28(3)(h)) and the
      missing deletion/return obligation on termination. Notes that a
      "SOC 2 in lieu of audit" clause is acceptable as a practical
      measure but must not replace the contractual right to audit.
      Specifies that deletion must include all copies, backups, and
      sub-processor holdings within a defined timeframe.
  - criterion: Children's data — enhanced contractual protections
    maxPoints: 15
    description: >-
      Identifies that the processed data relates to children (school
      pupils) and that this heightens every deficiency. The AADC and
      DUAA impose specific obligations on services processing
      children's data. The DPA should include specific provisions
      on children's data handling, age-appropriate processing, and
      enhanced security measures.
  - criterion: Practical redline recommendations
    maxPoints: 15
    description: >-
      Provides a clear, prioritised list of amendments Polaris should
      require before signing. Distinguishes between must-have
      (mandatory Article 28 clauses) and should-have (enhanced
      protections for children's data, tighter security specifications).
      Gives Niamh a practical document she can send to DataPulse.

exemplarResponse: |
  Hi Niamh,

  The short answer is: do not sign this. The DataPulse DPA is
  missing most of the clauses the UK GDPR requires, and the
  "anonymised insights" clause is a significant concern. This is
  not over-lawyering — these are mandatory provisions without
  which Polaris has no lawful basis for transferring pupil data
  to DataPulse.

  Here is the clause-by-clause review. I have marked each as
  Red (missing/non-compliant, must fix), Amber (deficient, should
  fix), or Green (adequate).

  **1. Processing on documented instructions — RED.** Article
  28(3)(a) requires the processor to process personal data only on
  documented instructions from the controller. The DPA says
  DataPulse will process "in accordance with applicable data
  protection laws" — that is not the same thing. The clause must
  say: DataPulse will process only on Polaris's documented
  instructions, and will inform Polaris if it believes an
  instruction infringes data protection law.

  **2. Confidentiality — AMBER.** There is a confidentiality
  section, but it does not specifically require DataPulse to
  ensure that persons authorised to process the data have
  committed themselves to confidentiality or are under a statutory
  obligation, as Article 28(3)(b) requires.

  **3. Security measures — AMBER.** "Appropriate technical and
  organisational measures" echoes Article 32 but without any
  specificity. For children's data, Polaris should require
  DataPulse to specify: encryption standards (in transit and at
  rest), access controls, logging, incident response procedures,
  and regular testing. SOC 2 Type II and ISO 27001 can satisfy
  the evidence requirement but the contractual obligation must
  exist independently.

  **4. Sub-processors — RED.** Complete absence. Article 28(2)
  requires prior written authorisation for sub-processors —
  either specific (named) or general (with notification and
  objection rights). DataPulse uses at least AWS and InsightForge.
  Both must be named in an annex, the same data protection
  obligations must flow down, and Polaris must have the right to
  object to new sub-processors.

  **5. Data subject rights assistance — RED.** No clause. Article
  28(3)(e) requires the processor to assist the controller in
  responding to data subject rights requests. For children's data,
  this includes parental access rights.

  **6. Breach notification — RED.** No clause specifying when
  DataPulse must notify Polaris of a breach. Article 28(3)(f)
  requires notification "without undue delay" — Polaris needs a
  specific timeframe (24 hours from awareness is standard in UK
  contracts) to meet its own 72-hour ICO notification obligation.

  **7. Deletion/return on termination — RED.** Nothing. Article
  28(3)(g) requires the processor to delete or return all personal
  data on termination and delete existing copies unless storage is
  required by law. This must cover all copies including backups
  and sub-processor holdings, within a defined period (30 days is
  standard).

  **8. Audit rights — RED.** No clause. Article 28(3)(h) requires
  the processor to make available all information necessary to
  demonstrate compliance and allow for audits. DataPulse's SOC 2
  report can satisfy day-to-day assurance, but Polaris must retain
  the contractual right to audit or appoint an independent auditor.

  **9. "Anonymised insights" clause — RED.** This is the most
  concerning provision. DataPulse claims the right to process
  "anonymised insights" for its own business purposes. Three
  problems:

  - If the anonymisation is genuine (irreversible, no reasonable
    means of re-identification), then GDPR does not apply and the
    clause is harmless — but Polaris has no way to verify this
    without seeing DataPulse's anonymisation methodology.
  - If the "anonymisation" is actually pseudonymisation (which is
    common — replacing names with IDs while retaining the ability
    to re-link), the data is still personal data and DataPulse is
    processing it for its own purposes, making it a controller.
  - Either way, DataPulse is deriving commercial value from
    children's engagement data. Even if technically lawful, this
    is a reputational risk for Polaris with school customers.

  My recommendation: delete this clause entirely. If DataPulse
  insists on retaining it, require: (a) a documented anonymisation
  methodology reviewed by Polaris, (b) an independent assessment
  confirming irreversibility, and (c) contractual commitment that
  the insights will never be re-linked to individuals.

  **10. Governing law — AMBER.** Delaware law. This is not
  inherently wrong for a US vendor, but the DPA should specify
  that it is subject to UK GDPR and that any conflict between
  Delaware law and UK data protection law is resolved in favour
  of the latter. Jurisdiction for DP disputes should be UK courts.

  **Your redline list — in priority order:**

  1. Add: processing only on documented instructions clause.
  2. Add: sub-processor annex naming AWS and InsightForge, with
     notification and objection mechanism for changes.
  3. Add: breach notification within 24 hours of awareness.
  4. Add: deletion of all data within 30 days of termination.
  5. Add: audit rights (annual right to audit or appoint auditor).
  6. Add: data subject rights assistance clause.
  7. Delete or fundamentally redraft: "anonymised insights" clause.
  8. Reference UK GDPR throughout (not just "GDPR").
  9. Add: specific security measures annex.
  10. Add: children's data provisions — AADC compliance, enhanced
      security, parental rights assistance.

  I can draft the redline for you — it will take a day. Do not
  sign before the redline is agreed. If DataPulse pushes back on
  the mandatory items (1-6, 8), walk away — a vendor that will
  not agree to Article 28 requirements is not a vendor you can
  lawfully use.

  Kind regards,
  Aegis Privacy Partners
