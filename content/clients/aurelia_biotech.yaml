id: aurelia_biotech
name: Aurelia Biotech plc
tier: 3
sector: Clinical-stage biotechnology (oncology and rare disease)
description: >-
  A publicly listed biotech running three Phase II and one Phase III
  clinical programmes across the UK, EU, and US. A growing in-house privacy
  team supports the Clinical Operations, Commercial, and R&D functions, but
  escalates to Aegis on novel matters — AI in candidate screening, pooled
  international research databases, collaborations with academic medical
  centres, and regulator (MHRA / EMA / FDA) disclosure obligations.
