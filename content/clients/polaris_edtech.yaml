id: polaris_edtech
name: Polaris EdTech Ltd
tier: 2
sector: SaaS education technology (UK-headquartered, international customers)
description: >-
  A venture-backed EdTech startup selling adaptive-learning software to
  primary and secondary schools across the UK, Ireland and the Nordics.
  Users are children aged 5-16; schools are both controllers and joint
  controllers depending on the product. Queries routinely touch on the Age
  Appropriate Design Code, DUAA, consent architecture for children, AI
  features, and cross-border transfers to US sub-processors.
logoInitials: PE
brandColour: "#2563EB"
regulatoryContext:
  - UK GDPR
  - DPA 2018
  - Data (Use and Access) Act 2024 (DUAA)
  - ICO Age Appropriate Design Code
  - EU GDPR (EU customers)
  - PECR (marketing)
